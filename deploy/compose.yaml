# Review-only internal deployment definition. No cloud/public endpoint is created.
name: finance-workbench
services:
  database:
    image: ${POSTGRES_IMAGE:?Set an IT-approved PostgreSQL 18 image digest}
    environment:
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Required}
      FINANCE_OWNER_PASSWORD: ${FINANCE_OWNER_PASSWORD:?Required}
      FINANCE_APP_PASSWORD: ${FINANCE_APP_PASSWORD:?Required}
    volumes:
      - ${POSTGRES_DATA_DIR:?Approved persistent path}:/var/lib/postgresql
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-finance.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  migration:
    image: ${API_IMAGE:?Set the built API image digest}
    env_file: .env.runtime
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Migration role URL is required}
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      database: { condition: service_healthy }
    profiles: ["migration"]
  api:
    image: ${API_IMAGE:?Required}
    env_file: .env.runtime
    volumes:
      - ${EXPORT_DATA_DIR:?Approved export storage path}:/data/exports
    depends_on:
      database: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    image: ${API_IMAGE:?Required}
    env_file: .env.runtime
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${EXPORT_DATA_DIR:?Required}:/data/exports
    depends_on:
      database: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:?Set the built frontend image digest}
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ${TLS_DIR:?Approved internal certificate directory}:/run/tls:ro
    depends_on: [api]
    restart: unless-stopped
